# Control Gains — 对标 OpenArm 的 control_gains.yaml
#
# 机械臂各关节的 MIT 控制增益。
# 在启动时加载为 ROS 参数，会覆盖 xacro 中的默认值。
#
# 调参说明（来自 OpenArm 文档）：
#   ⚠️ 请谨慎调整增益值。先用较低增益验证行为，再逐步增大。
#   如果在较大位置差下使用高增益执行动作，控制器可能产生危险的高速指令。
#
# 参数说明：
#   kp: MIT 模式比例增益（位置刚度）
#   kd: MIT 模式微分增益（速度阻尼）
#

# J2/J3 同步带耦合参数：
#   divide 模式:
#     J3 = (M3 + coupling*J2 - offset + a3*J2^3 + a2*J2^2 + a1*J2 + a0) / scale
#   multiply 模式:
#     J3 = scale*M3 + coupling*J2 - offset + a3*J2^3 + a2*J2^2 + a1*J2 + a0
#
# 当前试验参数来自:
#   python3 tools/j2j3_fit/j2j3_imu_fk_fit.py J.csv --fit-scale --scale-mode multiply --scale-min 0.7 --scale-max 1.3
j2j3_scale_mode: multiply
j2j3_coupling: 0.0
j2j3_j3_scale: 0.7
j2j3_j3_offset: 0.0
j2j3_poly_a3: -0.1041262438
j2j3_poly_a2: 0.1208684194
j2j3_poly_a1: 0.6827545244
j2j3_poly_a0: 0.3801699144
# 只放大/缩小 J3 的重力补偿力矩，不影响 J3 位置解耦。
j2j3_j3_gravity_effort_scale: 1.11

# 重力补偿输出比例。assist 模式下叠加到正常控制输出；gravity_only 模式下只输出重力项。
gravity_effort_scale: 1.1

arm_control_gains:
  joint1:
    motor_model: J8009
    kp: 120.0
    kd: 3.0
    can_bus: can0

  joint2:
    motor_model: J8009
    kp: 240.0
    kd: 3.0
    can_bus: can0

  joint3:
    motor_model: J8009
    kp: 240.0
    kd: 3.0
    can_bus: can0

  joint4:
    motor_model: J4340
    kp: 120.0
    kd: 3.0
    can_bus: can0

  joint5:
    motor_model: J4340
    kp: 120.0
    kd: 3.0
    can_bus: can1

  joint6:
    motor_model: J4310
    kp: 120.0
    kd: 1.0
    can_bus: can1

  joint7:
    motor_model: J4310
    kp: 60.0
    kd: 1.0
    can_bus: can1

  gripper:
    motor_model: J4310
    kp: 60.0
    kd: 1.0
    can_bus: can1
