# Control Gains — 对标 OpenArm 的 control_gains.yaml
#
# 机械臂各关节的 MIT 控制增益。
# 在启动时加载为 ROS 参数，会覆盖 xacro 中的默认值。
#
# 参数说明：
#   kp: MIT 模式比例增益（位置刚度）
#   kd: MIT 模式微分增益（速度阻尼）
#

# J2/J3 解耦多项式：当前实车验证可用的 J.csv multiply 方案。
# 来源：tools/j2j3_fit/data/j2j3_J_multiply_scale_fit.json
#   joint3_decoupled = scale * raw_joint3 + correction(raw_joint2)
#   correction = coupling * joint2 - offset
#              + a3*joint2^3 + a2*joint2^2 + a1*joint2 + a0
# 这套方案已通过当前实车 J2/J3 位姿对比验证。
j2j3_coupling: 0.0
j2j3_j3_scale: 0.7
j2j3_j3_offset: 0.0
j2j3_scale_mode: multiply
j2j3_poly_a3: -0.1041262438
j2j3_poly_a2: 0.1208684194
j2j3_poly_a1: 0.6827545244
j2j3_poly_a0: 0.3801699144

# 控制器重力补偿输出比例。
gravity_effort_scale: 1.1

arm_control_gains:
  joint1:
    motor_model: J8009
    kp: 120.0
    kd: 3.0
    can_bus: can0

  joint2:
    motor_model: J8009
    kp: 240.0
    kd: 3.0
    can_bus: can0

  joint3:
    motor_model: J8009
    kp: 240.0
    kd: 3.0
    can_bus: can0

  joint4:
    motor_model: J4340
    kp: 120.0
    kd: 3.0
    can_bus: can0

  joint5:
    motor_model: J4340
    kp: 120.0
    kd: 3.0
    can_bus: can1

  joint6:
    motor_model: J4310
    kp: 120.0
    kd: 1.0
    can_bus: can1

  joint7:
    motor_model: J4310
    kp: 60.0
    kd: 1.0
    can_bus: can1

  gripper:
    motor_model: J4310
    kp: 60.0
    kd: 1.0
    can_bus: can1
