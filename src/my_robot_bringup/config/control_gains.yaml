# Control Gains — 对标 OpenArm 的 control_gains.yaml
#
# 机械臂各关节的 MIT 控制增益。
# 在启动时加载为 ROS 参数，会覆盖 xacro 中的默认值。
#
# 参数说明：
#   kp: MIT 模式比例增益（位置刚度）
#   kd: MIT 模式微分增益（速度阻尼）
#

# J2/J3 解耦多项式：
#   joint3_decoupled = raw_joint3 + correction(raw_joint2)
#   correction = coupling * joint2 - offset + a3*joint2^3 + a2*joint2^2 + a1*joint2 + a0
# 当前硬件接口使用一套固定多项式，不根据运动方向切换参数。
j2j3_coupling: 0.0
j2j3_j3_scale: 1.0
j2j3_j3_offset: 0.0
j2j3_scale_mode: divide
j2j3_poly_a3: -0.2522016902
j2j3_poly_a2: 0.2727246110
j2j3_poly_a1: 0.9715433593
j2j3_poly_a0: -1.1654617560

# 控制器重力补偿输出比例。
gravity_effort_scale: 1.1

arm_control_gains:
  joint1:
    motor_model: J8009
    kp: 120.0
    kd: 3.0
    can_bus: can0

  joint2:
    motor_model: J8009
    kp: 240.0
    kd: 3.0
    can_bus: can0

  joint3:
    motor_model: J8009
    kp: 240.0
    kd: 3.0
    can_bus: can0

  joint4:
    motor_model: J4340
    kp: 120.0
    kd: 3.0
    can_bus: can0

  joint5:
    motor_model: J4340
    kp: 120.0
    kd: 3.0
    can_bus: can1

  joint6:
    motor_model: J4310
    kp: 120.0
    kd: 1.0
    can_bus: can1

  joint7:
    motor_model: J4310
    kp: 60.0
    kd: 1.0
    can_bus: can1

  gripper:
    motor_model: J4310
    kp: 60.0
    kd: 1.0
    can_bus: can1
